<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tutti Frutti</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2a1b4a;--paper:#fffdf7;--ok:#16803c;--h:48;--bg:hsl(var(--h) 88% 66%)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:500 17px/1.4 "Fredoka","Trebuchet MS",system-ui,sans-serif;transition:background .5s;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
main{max-width:480px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:36px;line-height:1;margin:6px 0 6px;font-weight:700;letter-spacing:-.5px}
.mut{font-size:15px;opacity:.8}
.ctr{text-align:center}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:14px;margin:14px 0;box-shadow:5px 5px 0 var(--ink)}
input,select{width:100%;font:inherit;padding:11px 12px;border-radius:12px;border:2.5px solid var(--ink);background:#fff;color:var(--ink);margin:4px 0 10px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button{font:inherit;font-weight:700;padding:13px 16px;border-radius:14px;border:3px solid var(--ink);background:var(--ink);color:#fff;width:100%;margin:8px 0 4px;box-shadow:0 5px 0 rgba(42,27,74,.35);cursor:pointer;transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(42,27,74,.35)}
button.alt{background:var(--paper);color:var(--ink)}
button.basta{background:#e11d48;font-size:26px;padding:16px;margin-top:14px}
button:disabled{opacity:.5}
.letter{width:150px;height:150px;margin:10px auto 8px;display:grid;place-items:center;background:var(--paper);color:hsl(var(--h) 85% 40%);border:4px solid var(--ink);border-radius:28px;box-shadow:6px 6px 0 var(--ink);font-size:104px;font-weight:700;line-height:1;transform:rotate(-4deg);animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:rotate(-14deg) scale(.4);opacity:0}}
@media(prefers-reduced-motion:reduce){.letter{animation:none}body{transition:none}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--paper);border:2.5px solid var(--ink);border-radius:99px;padding:3px 11px;font-size:15px;font-weight:600}
.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1.5px dashed rgba(42,27,74,.25)}
.row:last-child{border-bottom:0}
.pts{font-weight:700;color:var(--ok)}.pts.z{color:#8b7fa3}
.banner{background:#ffe14d;border:3px solid var(--ink);border-radius:16px;padding:10px;text-align:center;font-weight:700;margin:12px 0;box-shadow:4px 4px 0 var(--ink)}
label{display:block;font-size:15px;font-weight:600}
.pill{display:table;margin:4px auto 10px;background:var(--paper);border:2.5px solid var(--ink);border-radius:99px;padding:2px 14px;font-weight:700}
.room{display:inline-block;background:var(--paper);border:2.5px solid var(--ink);border-radius:99px;padding:2px 14px;margin:0 0 10px}
.room b{letter-spacing:1px}
.hide{display:none}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:18px 0 8px}
.pod{flex:1;text-align:center;font-weight:600}
.pod .blk{border:3px solid var(--ink);border-radius:14px 14px 0 0;background:var(--paper);display:grid;place-items:center;font-size:34px;font-weight:700;margin-top:6px}
.p1 .blk{height:120px;background:#ffe14d}.p2 .blk{height:88px}.p3 .blk{height:64px}
.cf{position:fixed;top:-16px;width:9px;height:14px;z-index:9;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
.fx{position:fixed;inset:0;z-index:20;display:grid;place-content:center;text-align:center;background:rgba(225,29,72,.94);color:#fff;pointer-events:none;animation:fxbg 2.2s forwards}
.fx b{display:block;font-size:clamp(64px,22vw,130px);line-height:1;font-weight:700;text-shadow:5px 5px 0 var(--ink);animation:slam .55s cubic-bezier(.2,1.8,.4,1) both}
.fx span{display:block;margin-top:14px;font-size:24px;font-weight:600;animation:fxsub .4s .35s both}
@keyframes slam{0%{transform:scale(3.2) rotate(-14deg);opacity:0}60%{transform:scale(.92) rotate(3deg);opacity:1}100%{transform:scale(1) rotate(-3deg);opacity:1}}
@keyframes fxbg{0%{opacity:0}8%{opacity:1}78%{opacity:1}100%{opacity:0}}
@keyframes fxsub{from{opacity:0;transform:translateY(12px)}}
@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-9px,4px)}40%{transform:translate(8px,-5px)}60%{transform:translate(-6px,-3px)}80%{transform:translate(5px,5px)}}
body.shake main{animation:shake .45s}
@media(prefers-reduced-motion:reduce){.fx b,.fx span,body.shake main{animation:none}}
.tblw{overflow-x:auto;background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:5px 5px 0 var(--ink);margin:14px 0}
.rt{border-collapse:collapse;width:100%}
.rt th{padding:6px 4px;font-size:13px;font-weight:700}
.rt th.cat{text-align:center;font-size:11px;font-weight:600;min-width:54px;position:sticky;left:0;background:var(--paper);line-height:1.2}
.rt th.cat span{display:block;font-size:20px}
.rt td{border-top:1.5px solid rgba(42,27,74,.2);border-left:1.5px solid rgba(42,27,74,.2);padding:6px;vertical-align:top;min-width:90px;text-align:center}
.rt td .w{font-weight:600;word-break:break-word;font-size:15px}
.rt td .pt{font-size:12px;font-weight:700;margin-top:2px}
.rt td.g{background:#c9f2d0}.rt td.y{background:#fff0a6}.rt td.r{background:#ffd9d9}.rt td.e{background:#eee9f5;color:#8b7fa3}
.rt td.an{background:#ffd9d9}.rt td.an .w{text-decoration:line-through}
.rt td.tap{cursor:pointer}.rt td.mv{outline:3px solid var(--ink);outline-offset:-3px}
#eov{position:fixed;inset:0;z-index:50;background:#0b0720;color:#fff;overflow:hidden;display:none;text-align:center}
#eov.on{display:block}
#est{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;z-index:2}
#ecv{position:absolute;inset:0;z-index:3;pointer-events:none}
#ex{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:9;width:auto;margin:0;padding:6px 14px;background:#ffffff22;border-color:#fff;box-shadow:none}
.ebeam{position:absolute;bottom:-10%;left:50%;width:34vw;height:130vh;transform-origin:50% 100%;background:linear-gradient(to top,rgba(255,255,200,.4),transparent);animation:esweep 2.6s ease-in-out infinite alternate}
.eb2{animation-direction:alternate-reverse}
@keyframes esweep{from{transform:translateX(-50%) rotate(-42deg)}to{transform:translateX(-50%) rotate(42deg)}}
.etx{font-size:30px;font-weight:700;z-index:2}
.enum{font-size:clamp(130px,42vw,240px);font-weight:700;color:#ffd23f;line-height:1;animation:enumpop .85s both}
@keyframes enumpop{0%{transform:scale(3.5);opacity:0}25%{transform:scale(1);opacity:1}100%{transform:scale(.8);opacity:.25}}
#eov.eshk{animation:eshk .45s}
@keyframes eshk{20%{transform:translate(-14px,8px)}40%{transform:translate(12px,-10px)}60%{transform:translate(-9px,-6px)}80%{transform:translate(7px,8px)}}
.eflash{position:fixed;inset:0;background:#fff;z-index:8;animation:efl .8s forwards;pointer-events:none}
@keyframes efl{to{opacity:0}}
.erays{position:absolute;left:50%;top:40%;width:240vmax;height:240vmax;margin:-120vmax 0 0 -120vmax;background:repeating-conic-gradient(rgba(255,210,63,.4) 0 8deg,transparent 8deg 20deg);-webkit-mask-image:radial-gradient(circle,#000 4%,transparent 38%);mask-image:radial-gradient(circle,#000 4%,transparent 38%);animation:espin 14s linear infinite}
@keyframes espin{to{transform:rotate(360deg)}}
.ering{position:absolute;left:50%;top:40%;width:20px;height:20px;margin:-10px;border:6px solid #fff;border-radius:50%;animation:ering 1.3s ease-out forwards}
@keyframes ering{to{transform:scale(70);opacity:0}}
.etrophy{font-size:clamp(90px,28vw,150px);line-height:1;animation:erise 1s cubic-bezier(.2,1.5,.4,1) both;z-index:2}
@keyframes erise{from{transform:translateY(320px) scale(.2) rotate(-40deg);opacity:0}}
.ename{z-index:2;margin:6px 0}
.ename span{display:inline-block;font-size:clamp(38px,13vw,76px);font-weight:700;color:#fff;text-shadow:0 0 22px #ffd23f,4px 4px 0 #e11d48;animation:estomp .4s both cubic-bezier(.3,1.8,.5,1)}
@keyframes estomp{from{transform:scale(6) translateY(-90px);opacity:0}}
.esub{font-size:28px;font-weight:700;color:#ffd23f;letter-spacing:3px;z-index:2;animation:estomp .5s 1s both}
.epod{display:flex;gap:10px;margin-top:20px;z-index:2;animation:eup .8s both}
@keyframes eup{from{transform:translateY(120px);opacity:0}}
.epod div{background:#ffffff1f;border:2px solid #fff6;border-radius:14px;padding:8px 14px;font-size:17px}
#iov{position:fixed;inset:0;z-index:60;display:none;background:hsl(var(--ih,330) 85% 62%);transition:background .15s;overflow:hidden;text-align:center;flex-direction:column;align-items:center;justify-content:center;padding:16px}
#iov.on{display:flex}
.itile{width:min(52vw,210px);aspect-ratio:1;display:grid;place-items:center;background:#fffdf7;color:#2a1b4a;border:5px solid #2a1b4a;border-radius:34px;box-shadow:8px 8px 0 #2a1b4a;font-size:min(36vw,150px);font-weight:700;line-height:1;transform:rotate(-5deg);z-index:2}
.itile.out{animation:iout .45s forwards}
@keyframes iout{to{transform:translateY(-70vh) scale(.2) rotate(40deg);opacity:0}}
.ifr{position:absolute;top:0;z-index:1;animation:ifall 1.7s cubic-bezier(.5,0,.8,.6) forwards}
@keyframes ifall{0%{transform:translateY(-80px) rotate(0)}75%{transform:translateY(calc(100vh - 70px)) rotate(300deg)}88%{transform:translateY(calc(100vh - 150px)) rotate(340deg)}100%{transform:translateY(calc(100vh - 70px)) rotate(380deg)}}
.ititle{z-index:2;line-height:1.05}
.ititle span{display:inline-block;font-size:clamp(46px,16vw,84px);font-weight:700;text-shadow:4px 4px 0 #2a1b4a;-webkit-text-stroke:2px #2a1b4a;animation:ipop .45s both cubic-bezier(.3,1.9,.5,1)}
@keyframes ipop{from{transform:scale(0) rotate(var(--r,20deg));opacity:0}}
.isub{z-index:2;font-size:21px;font-weight:600;margin-top:14px;color:#2a1b4a;animation:ipop .5s 1.1s both}
.igo{z-index:2;margin-top:28px;width:auto;padding:14px 30px;font-size:22px;animation:ipulse .8s infinite alternate}
@keyframes ipulse{to{transform:scale(1.08)}}
.home-game-picker{border:2px dashed rgba(36,20,63,.28);border-radius:16px;padding:10px 12px 12px;margin:0 0 14px}
.home-game-picker label{margin-top:0}
.home-game-picker select{margin-bottom:4px}
body.impostor-theme #join .card{background:linear-gradient(180deg,rgba(38,24,64,.98),rgba(23,17,39,.97));border-color:#b9a9d7;color:#f5efff}
body.impostor-theme #join .card:after{background:#7c3aed;opacity:.3}
body.impostor-theme #join .card label{color:#e2d8f6}
body.impostor-theme #join .home-game-picker{background:rgba(255,255,255,.06);border:2px dashed #b9a9d7;border-radius:16px}
body.impostor-theme #join .home-game-picker select{background:#321d4a;color:#fff}
body.impostor-theme #join #enter{background:linear-gradient(135deg,#e11d48,#bf1241);border-color:#ff7891;box-shadow:0 6px 0 #7f1235;color:#fff}
body.impostor-theme #join #create{background:#211638;color:#fff;border-color:#b9a9d7;box-shadow:0 5px 0 rgba(0,0,0,.4)}
body.impostor-theme #join #err{color:#ffb4c4}
body.impostor-theme #join input::placeholder{color:#a898c8}
.ivote.sel{outline:3px solid #ffd23f;background:#5b1631!important}
.imp-reveal-card{position:relative;min-height:230px;overflow:hidden;text-align:center;background:linear-gradient(145deg,#211638,#32134b)!important;border-color:#ff7891!important;color:#fff;perspective:900px}.imp-reveal-card .imp-player-name{font-size:20px;color:#e9ddff;margin:2px 0 15px}.imp-reveal-card .imp-cover{position:absolute;inset:58px 14px 14px;z-index:3;display:grid;place-items:center;border-radius:18px;background:linear-gradient(145deg,#e11d48,#5b1631);border:3px solid #ff7891;box-shadow:0 8px 0 #7f1235;transition:transform .7s cubic-bezier(.2,1.45,.4,1),opacity .35s}.imp-reveal-card .imp-cover span{font-size:34px;font-weight:700}.imp-reveal-card.revealed .imp-cover{transform:translateY(-120%);opacity:0;pointer-events:none}.imp-reveal-card #irole{min-height:115px;display:grid;place-items:center;white-space:pre-line;font-size:18px;font-weight:700}.imp-reveal-card #ishow{position:relative;z-index:4;width:auto;margin:8px auto 0;padding:9px 18px;background:#fff;color:#32134b;border-color:#fff;box-shadow:0 4px 0 #b9a9d7}.imp-reveal-card.revealed #ishow{background:#e11d48;color:#fff;border-color:#ff7891;box-shadow:0 4px 0 #7f1235}@media(prefers-reduced-motion:reduce){.imp-reveal-card .imp-cover{transition:none}}
</style>
<style>
/* --- Visual refresh: Tutti Frutti --- */
:root{
  --ink:#24143f;
  --ink-soft:#5f5277;
  --paper:#fffdf8;
  --paper-2:#fff8ec;
  --line:rgba(36,20,63,.16);
  --shadow:0 14px 30px rgba(36,20,63,.16);
  --shadow-small:0 6px 0 rgba(36,20,63,.18);
}
html{background:#f6c84b}
body{
  background:
    radial-gradient(circle at 10% 8%,rgba(255,255,255,.38) 0 8%,transparent 9%),
    radial-gradient(circle at 92% 22%,rgba(255,255,255,.25) 0 10%,transparent 11%),
    linear-gradient(145deg,hsl(var(--h) 88% 69%),hsl(calc(var(--h) + 32) 82% 58%));
  color:var(--ink);
}
body:before,body:after{content:"";position:fixed;z-index:-1;pointer-events:none;border-radius:50%;filter:blur(1px);opacity:.32}
body:before{width:190px;height:190px;right:-70px;top:110px;background:#fff}
body:after{width:130px;height:130px;left:-55px;bottom:80px;background:#ff5c78}
main{max-width:560px;padding:26px 18px 52px}
h1{font-size:clamp(38px,10vw,52px);letter-spacing:-1.5px;text-shadow:3px 3px 0 rgba(255,255,255,.5);margin:10px 0 8px}
.mut{color:var(--ink-soft);font-weight:500}
#join>p:first-of-type{font-size:18px;line-height:1.35;max-width:390px;margin:0 auto 20px}
#join{position:relative}
#join .card{position:relative;overflow:hidden;padding:24px 20px 20px;background:linear-gradient(180deg,rgba(255,253,248,.98),rgba(255,248,236,.96))}
#join .card:before{content:"🍉  🍓  🍍";display:block;text-align:center;font-size:25px;letter-spacing:5px;margin:-4px 0 12px;filter:drop-shadow(2px 3px 0 rgba(36,20,63,.12))}
#join .card:after{content:"";position:absolute;width:110px;height:110px;right:-50px;bottom:-52px;border-radius:50%;background:#ff5c78;opacity:.18}
#join #enter{background:linear-gradient(135deg,#e11d48,#bf1241);border-color:#8f1033;box-shadow:0 6px 0 #8f1033;font-size:18px}
#join #create{background:#fff;color:var(--ink);border-color:var(--ink);box-shadow:0 5px 0 rgba(36,20,63,.14)}
#join #err{min-height:21px;margin-top:8px;font-weight:600}
.welcome-badge{display:table;margin:0 auto 12px;background:rgba(255,253,248,.86);border:2px solid var(--ink);border-radius:999px;padding:5px 13px;font-weight:700;box-shadow:0 4px 0 rgba(36,20,63,.12)}
#join:before{content:"🍓  🍉  🍍";display:block;text-align:center;font-size:28px;letter-spacing:7px;margin:4px 0 2px;filter:drop-shadow(2px 3px 0 rgba(36,20,63,.14))}
.card,.tblw{
  background:rgba(255,253,248,.94);
  border:2px solid var(--ink);
  border-radius:24px;
  box-shadow:var(--shadow);
  padding:18px;
  margin:18px 0;
}
.card b{font-size:19px}
label{margin-top:8px;color:var(--ink-soft);font-size:14px;letter-spacing:.1px}
input,select{
  border:2px solid var(--ink);
  background:#fff;
  border-radius:14px;
  padding:13px 14px;
  min-height:48px;
  margin:5px 0 12px;
  color:var(--ink);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8);
}
input::placeholder{color:#a59bb4}
input:focus,select:focus{border-color:#e11d48;box-shadow:0 0 0 4px rgba(225,29,72,.14)}
button{
  border:2px solid var(--ink);
  border-radius:15px;
  min-height:48px;
  margin:8px 0 5px;
  background:var(--ink);
  box-shadow:var(--shadow-small);
  letter-spacing:.1px;
}
button:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px)}
button:active{transform:translateY(4px)}
button.alt{background:var(--paper);color:var(--ink);box-shadow:0 5px 0 rgba(36,20,63,.12)}
button.basta{background:linear-gradient(135deg,#f21d50,#bf1241);border-color:#8f1033;box-shadow:0 6px 0 #8f1033;font-size:25px;min-height:62px;letter-spacing:.6px}
.banner{background:linear-gradient(135deg,#ffe768,#ffd13f);border:2px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);padding:13px 14px;margin:16px 0;font-size:16px}
.room{background:rgba(255,253,248,.9);border:2px solid var(--ink);padding:6px 14px;margin-bottom:12px;box-shadow:0 4px 0 rgba(36,20,63,.16)}
.chips{gap:8px}
.chip{background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:6px 12px;font-size:14px;box-shadow:0 3px 0 rgba(36,20,63,.13)}
#players{margin:12px 0 16px!important}
.letter{width:clamp(138px,42vw,176px);height:clamp(138px,42vw,176px);font-size:clamp(92px,25vw,120px);background:linear-gradient(145deg,#fff,#fff6df);border:4px solid var(--ink);box-shadow:8px 8px 0 var(--ink),0 18px 35px rgba(36,20,63,.18);color:hsl(var(--h) 85% 40%);margin:16px auto 12px}
.pill{background:var(--ink);color:#fff;border:0;padding:7px 16px;box-shadow:0 4px 0 rgba(36,20,63,.25);font-size:17px}
#main>.mut.ctr{font-size:15px;font-weight:600;letter-spacing:.2px}
#main .card input{margin-bottom:7px}
#main .card label{font-size:15px;color:var(--ink);font-weight:700}
.row{padding:10px 0;border-bottom:1px solid var(--line)}
.pts{font-variant-numeric:tabular-nums}
.tblw{padding:5px;overflow-x:auto}
.rt th{padding:10px 5px;color:var(--ink-soft)}
.rt th.cat{background:var(--paper);border-right:1px solid var(--line)}
.rt td{padding:10px 7px;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.rt td .w{font-size:15px}
.rt td .pt{font-size:12px;margin-top:4px}
.rt td.g{background:#c9f2d0}.rt td.y{background:#fff0a6}.rt td.r{background:#ffd9d9}.rt td.e{background:#f0ecf6}
.podium{gap:10px;margin:24px 0 14px}
.pod .blk{border:2px solid var(--ink);box-shadow:0 5px 0 rgba(36,20,63,.2)}
.p1 .blk{background:#ffe04d}
.identity-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.identity-grid label{margin-top:0}
.avatar-choice{font-size:24px;padding:8px 10px}
.pavatar{display:inline-grid;place-items:center;width:27px;height:27px;margin-right:5px;border:2px solid var(--ink);border-radius:50%;background:var(--player-color,#ffe14d);vertical-align:middle;font-size:16px;line-height:1;box-shadow:0 2px 0 rgba(36,20,63,.15)}
.player-chip{display:inline-flex;align-items:center}
.pod-name{display:flex;align-items:center;justify-content:center;gap:4px;min-height:30px}
#hostbox .chips{margin-top:8px}
#hostbox .card,#guestbox .card{box-shadow:none}
#ver{font-weight:700}
@media(max-width:380px){main{padding-left:13px;padding-right:13px}.card{padding:14px}.chip{font-size:13px;padding:5px 9px}}
@media(prefers-reduced-motion:reduce){button:hover:not(:disabled){transform:none}}
@keyframes welcomeFlow{
  0%,100%{background-position:0% 0%,100% 12%,50% 100%,0 0}
  50%{background-position:18% 16%,82% 0%,58% 82%,0 0}
}
@keyframes welcomeGlow{0%,100%{transform:scale(1) rotate(0deg);opacity:.28}50%{transform:scale(1.16) rotate(8deg);opacity:.42}}
body:has(#join:not(.hide)){background:
  radial-gradient(circle at 10% 8%,rgba(255,255,255,.46) 0 8%,transparent 9%),
  radial-gradient(circle at 92% 22%,rgba(255,255,255,.32) 0 10%,transparent 11%),
  radial-gradient(circle at 50% 100%,rgba(255,255,255,.18) 0 18%,transparent 38%),
  linear-gradient(145deg,hsl(var(--h) 88% 69%),hsl(calc(var(--h) + 32) 82% 58%));
  background-size:120% 120%,120% 120%,140% 140%,100% 100%;
  animation:welcomeFlow 12s ease-in-out infinite;
}

const pcs={},RTC={iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}]};
const remoteAudios=[];
let voiceOn=false,listenOn=false,myGen=0,stream=null,sigRef=null;
function sendSig(to,type,data){ref.child("sig/"+to).push({from:myId,type:type,data:JSON.stringify(data),gen:myGen})}
function vinfo(){
  const ids=Object.keys(pcs),ok=ids.filter(i=>pcs[i].pc.connectionState==="connected").length;
  $("#vinfo").textContent=!listenOn?"":!voiceOn?(ids.length?"🔊 Escuchando a los demás · Conectados: "+ok+" de "+ids.length:"🔊 Escuchando la llamada…"):ids.length?("🎙️ Micrófono activo · Conectados: "+ok+" de "+ids.length+(ok<ids.length?" (si alguien no conecta, puede ser por su red)":"")):"🎙️ Micrófono activo · Esperando a otros en la llamada…";
}
function closePc(id){
  const o=pcs[id];if(!o)return;
  try{o.pc.close()}catch(e){}
  if(o.audio){const i=remoteAudios.indexOf(o.audio);if(i>=0)remoteAudios.splice(i,1);o.audio.remove()}
  delete pcs[id];
}
function mkPc(id,forOffer=true,peerGen=0){
  if(pcs[id])return pcs[id];
  const pc=new RTCPeerConnection(RTC),o={pc:pc,q:[],peerGen:peerGen};pcs[id]=o;
  if(stream)stream.getTracks().forEach(t=>pc.addTrack(t,stream));
  else if(forOffer)pc.addTransceiver("audio",{direction:"recvonly"});
  pc.onicecandidate=e=>{if(e.candidate)sendSig(id,"cand",e.candidate)};
  pc.ontrack=e=>{
    let a=o.audio;
    if(!a){a=o.audio=document.createElement("audio");a.autoplay=true;a.setAttribute("playsinline","");a.setAttribute("aria-label","Audio de la llamada");remoteAudios.push(a);document.body.appendChild(a)}
    a.srcObject=e.streams[0]||new MediaStream([e.track]);
    if(a.play)a.play().catch(()=>{});
  };
  pc.onconnectionstatechange=()=>{if(pc.connectionState==="failed")closePc(id);vinfo()};
  return o;
}
async function onSig(snap){
  const m=snap.val();snap.ref.remove();
  if(!m||!listenOn)return;
  let d;try{d=JSON.parse(m.data)}catch(e){return}
  try{
    if(m.type==="offer"){
      closePc(m.from);const o=mkPc(m.from,false,m.gen||0);
      await o.pc.setRemoteDescription(d);
      const an=await o.pc.createAnswer();await o.pc.setLocalDescription(an);
      sendSig(m.from,"answer",o.pc.localDescription);
      o.q.forEach(c=>o.pc.addIceCandidate(c).catch(()=>{}));o.q=[];
    }else if(m.type==="answer"){
      const o=pcs[m.from];if(!o)return;
      await o.pc.setRemoteDescription(d);
      o.q.forEach(c=>o.pc.addIceCandidate(c).catch(()=>{}));o.q=[];
    }else if(m.type==="cand"){
      const o=pcs[m.from];if(!o)return;
      if(o.pc.remoteDescription)o.pc.addIceCandidate(d).catch(()=>{});else o.q.push(d);
    }
  }catch(e){}
}
function updVoiceUI(){

function startListening(){
  if(listenOn||!ref)return;
  listenOn=true;
  sigRef=ref.child("sig/"+myId);
  sigRef.remove();
  sigRef.on("child_added",onSig);
  sigRef.onDisconnect().remove();
  me.update({li:true});

}
function stopListening(){
  if(!listenOn)return;
  listenOn=false;
  Object.keys(pcs).forEach(closePc);
  if(sigRef){sigRef.off();sigRef.remove();sigRef=null}
  if(me)me.update({li:false});
}
async function joinVoice(){
  if(voiceOn)return;
  if(!navigator.mediaDevices||!window.RTCPeerConnection){alert("Tu navegador no permite llamadas de voz.");return}
  startListening();
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}})}
  catch(e){alert("No se pudo usar el micrófono. Revisá el permiso en el navegador.");return}
  voiceOn=true;myGen=Date.now();
  Object.keys(pcs).forEach(closePc);
  me.update({vc:true,mu:false,gen:myGen});
  updVoiceUI();update();
}
function leaveVoice(){
  if(!voiceOn)return;
  voiceOn=false;
  Object.keys(pcs).forEach(closePc);
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  myGen=Date.now();
  me.update({vc:false,mu:false,gen:myGen});
  updVoiceUI();
}
function toggleMute(){
  const t=stream&&stream.getAudioTracks()[0];if(!t)return;
  t.enabled=!t.enabled;me.update({mu:!t.enabled});updVoiceUI();
}
function syncVoice(s){
  const on=!!((data||{}).cfg||{}).voice;
  $("#voicebar").classList.toggle("hide",!on);
  if(!on){if(voiceOn)leaveVoice();stopListening();return}
  startListening();
  const pm={};s.ps.forEach(p=>{pm[p.id]=p});
  const gOf=id=>(pm[id]&&pm[id].gen)||0;
  const want=s.ps.filter(p=>!p.me&&(p.vc||(voiceOn&&p.li))).map(p=>p.id);
  Object.keys(pcs).forEach(id=>{if(!want.includes(id)||pcs[id].peerGen!==gOf(id))closePc(id)});
  want.forEach(id=>{
    if(!pcs[id]&&myId<id){
      const o=mkPc(id,true,gOf(id));
      o.pc.createOffer().then(x=>o.pc.setLocalDescription(x)).then(()=>sendSig(id,"offer",o.pc.localDescription)).catch(()=>closePc(id));
    }
  });
  vinfo();
}

function snd(k){

    AC.resume();
    const seq={start:[[523,.1],[659,.1],[784,.18]],basta:[[300,.12],[300,.2]],done:[[784,.1],[988,.1],[1319,.25]],win:[[523,.12],[659,.12],[784,.12],[1047,.3],[784,.12],[1047,.45]]}[k];

  }).then(snap=>{

    try{localStorage.setItem("tf-room",JSON.stringify({code:roomCode,t:Date.now()}))}catch(e){}

    });

    $("#code").textContent=code;

  }).catch(e=>{if(e&&e.code==="kicked"){try{localStorage.removeItem("tf-room")}catch(x){}}
    $("#err").textContent=e&&e.code==="kicked"?"No podés entrar a esa sala.":e&&e.code==="not-found"?"Sala no encontrada. Verificá el número e intentá nuevamente.":e&&e.code==="exists"?"Ese número ya está ocupado. Intentá crear otra sala.":"Error de conexión: "+(e&&e.code||e)});
}

  const d=data||{},pl=d.players||{};
  const ps=Object.keys(pl).filter(k=>pl[k].name&&(pl[k].on||(pl[k].off&&Date.now()+srvOff-pl[k].off<GRACE)))
    .map(k=>Object.assign({id:k,me:k===myId,rc:!pl[k].on},pl[k]));
  graceActive=ps.some(p=>p.rc);
  const cur=d.rd||null;
  const b=cur&&d.bs&&d.bs.n===cur.n?d.bs:null;
  let phase="lobby";
  if(cur){phase="play";
    if(b){if(!bastaSeen[cur.n])bastaSeen[cur.n]=Date.now();
      phase=Date.now()-bastaSeen[cur.n]<2500?"closing":"reveal"}}
  return{ps,cur,b,phase};
}

function score(s){
  const L=norm(s.cur.letter),res={},V=((data||{}).votes||{})[s.cur.n]||{};
  const ans=p=>p.a&&p.a.n===s.cur.n&&p.a.v?p.a.v:[];
  const nv=(i,p)=>Object.keys(V[i+"_"+p.id]||{}).filter(k=>k!==p.id).length;
  const an=(i,p)=>nv(i,p)*2>Math.max(s.ps.length-1,1);
  const okf=(p,i)=>{const t=norm(ans(p)[i]);return t.length>1&&t[0]===L&&!an(i,p)};
  CATS.forEach((c,i)=>{
    const cnt=Object.create(null);
    s.ps.forEach(p=>{if(okf(p,i)){const t=norm(ans(p)[i]);cnt[t]=(cnt[t]||0)+1}});
    s.ps.forEach(p=>{
      const raw=String(ans(p)[i]||"").trim(),t=norm(raw),ok=okf(p,i);
      (res[p.id]=res[p.id]||{pts:0,c:[]}).c[i]={raw,pts:ok?(cnt[t]>1?5:10):0,votes:nv(i,p),an:an(i,p)&&t.length>1};
    });
  });
  for(const k in res)res[k].pts=res[k].c.reduce((a,x)=>a+x.pts,0);
  const bs=(data||{}).bs;
  if(bs&&bs.n===s.cur.n&&bs.by&&res[bs.by]){
    const bad=res[bs.by].c.filter(x=>x.pts===0).length;
    res[bs.by].bad=bad;res[bs.by].pen=bad*PEN;res[bs.by].pts-=bad*PEN;
  }
  return res;
}

const clean=()=>CATS.map((_,i)=>String(myAns[i]||""));
const sendAns=n=>me.child("a").set({n,v:clean()});

function tick(){
  impTick();
  if(graceActive&&Date.now()-graceAt>5000){graceAt=Date.now();update()}
  const c=data&&data.rd;
  if(!c||!c.dur||(data.bs&&data.bs.n===c.n))return;
  const left=c.dur-Math.floor((Date.now()-(roundSeen[c.n]||Date.now()))/1000);
  const t=$("#tm");if(t)t.textContent="⏱ "+Math.max(left,0)+" s";
  if(left<=0)ref.child("bs").transaction(x=>(x&&x.n===c.n)?undefined:{n:c.n,t:1});
}

function update(){
  const s=state(),d=data||{};
  if(s.cur)stopMusic();else startMusic();
  if(d.kicked&&d.kicked[myId]&&!left){left=true;ref.off();try{me.onDisconnect().cancel();me.remove()}catch(e){}try{localStorage.removeItem("tf-room")}catch(e){}alert("El anfitrión te sacó de la sala.");location.reload();return}
  if(s.cur&&Array.isArray(s.cur.cats))CATS=s.cur.cats;
  else if(!s.cur)CATS=Array.isArray((d.cfg||{}).cats)?d.cfg.cats:DEFCATS;
  const ev=s.phase+":"+(s.cur?s.cur.n+s.cur.letter:"");
  if(ev!==lastEv){lastEv=ev;try{localStorage.setItem("tf-room",JSON.stringify({code:roomCode,t:Date.now()}))}catch(e){}if(s.phase==="play")snd("start");else if(s.phase==="closing"){snd("basta");bastaFx(s.b)}else if(s.phase==="reveal"){if(!(s.cur.total&&s.cur.n>=s.cur.total))snd("done")}}
  document.documentElement.style.setProperty("--h",s.cur?Math.round(LETTERS.indexOf(s.cur.letter)*13.8):48);
  const pl=$("#players");pl.textContent="";
  pl.classList.toggle("hide",s.phase==="lobby");
  s.ps.forEach(p=>{
    let ex="";
    if((s.phase==="play"||s.phase==="closing")&&s.cur){
      const k=p.a&&p.a.n===s.cur.n&&p.a.v?Object.values(p.a.v).filter(x=>norm(x).length>0).length:0;
      ex=k>=CATS.length?" ✅":" ✍️"+k+"/"+CATS.length;
    }
    const chip=el("span","chip");chip.classList.add("player-chip");chip.appendChild(avatarEl(p));chip.appendChild(document.createTextNode((p.vc?(p.mu?"🔇 ":"🎙️ "):"")+(p.rc?"⏳ ":"")+(d.host===p.id?"👑 ":"")+(p.me?"Vos":p.name)+": "+(p.tot||0)+" pts"+ex));pl.appendChild(chip);
  });
  // anfitrión: si no hay o está desconectado, lo toma el que entró primero
  const hostOn=d.host&&s.ps.some(p=>p.id===d.host);
  if(!hostOn&&s.ps.length&&!claiming){
    const first=s.ps.slice().sort((a,b)=>(a.jt||0)-(b.jt||0))[0];
    if(first.me){claiming=true;const seen=d.host||null;
      ref.child("host").transaction(c=>(c||null)===seen?myId:undefined).then(()=>{claiming=false},()=>{claiming=false})}
  }
  if(((d.cfg||{}).mode)==="impostor"&&d.imp&&d.imp.phase){
    stopMusic();pl.classList.add("hide");$("#msg").textContent="";
    renderImp(s,d);syncVoice(s);return;
  }
  if(!s.cur){showAns=false;finalN=0;lastN=0;lastL="";flushedN=0;answerFlushN=0;bastaSeen={};roundSeen={};
    const mp=(d.players||{})[myId]||{};banked=mp.tot||0;bankedN=mp.tn||0;prevTot=mp.pt||0;cw=mp.cw||0;prevCw=mp.pc||0}
  if(s.cur&&!roundSeen[s.cur.n])roundSeen[s.cur.n]=Date.now();
  if(s.cur&&(s.cur.n!==lastN||s.cur.letter!==lastL)){lastN=s.cur.n;lastL=s.cur.letter;myAns=[];answerFlushN=0;sendAns(lastN)}
  clearTimeout(timer);
  const msg=$("#msg");msg.textContent="";
  if(s.phase==="closing"){
    msg.appendChild(el("div","banner",s.b.t?"¡Se acabó el tiempo!":"¡BASTA! "+s.b.name+" terminó. Cerrando…"));
    if(flushedN!==s.cur.n){flushedN=s.cur.n;sendAns(s.cur.n)}
    document.querySelectorAll("#main input,#main button").forEach(e=>e.disabled=true);
    timer=setTimeout(update,2600-(Date.now()-bastaSeen[s.cur.n])+60);
  }
  const key=s.phase==="lobby"?"l":s.phase==="reveal"?"r"+Date.now():"p"+(s.cur&&(s.cur.n+s.cur.letter));
  if(key!==sig){
    const y=window.scrollY;sig=key;
    const m=$("#main");m.textContent="";
    if(s.phase==="lobby")buildLobby(m);
    else if(s.phase==="reveal")buildReveal(m,s);
    else buildPlay(m,s);
    if(s.phase==="reveal")window.scrollTo(0,y);
  }
  if(s.phase==="reveal"&&answerFlushN!==s.cur.n){answerFlushN=s.cur.n;sendAns(s.cur.n)}
  if(s.phase==="lobby")refreshLobby(s);
  syncVoice(s);
}

const TSV=()=>firebase.database.ServerValue.TIMESTAMP;
const nm=(d,id)=>{const p=(d.players||{})[id];return p?p.name:"?"};
function pickWord(cat){

  if(!k)k=keys[Math.random()*keys.length|0];

  return{cat:k,word:L[i],sim:L[(i+1+(Math.random()*3|0))%L.length]};
}
function startImp(pn){

  if(ps.length<3){alert("Se necesitan al menos 3 jugadores para el Impostor.");return}

    return{n:pn+1,phase:"clue",cat:w.cat,word:w.word,sim:w.sim,imps:imps,ord:ids.slice().sort(()=>Math.random()-.5),ct:c.impClueTime||0,vt:c.impVoteTime||0,cm:c.impClue||"written",vm:c.impVote||"secret",wm:c.impWord||"none",tb:c.impTie||"revote",rv:c.impReveal||"full",vr:0};

function toVote(n){
  ref.child("imp").transaction(c=>{if(!c||c.n!==n||c.phase!=="clue")return;c.phase="vote";return c})
    .then(r=>{if(r.committed)ref.child("imp/t0").set(TSV())});
}
function toResult(n,vr){
  const d=data||{},I=d.imp;
  if(!I||I.n!==n||I.phase!=="vote"||(I.vr||0)!==vr)return;
  const V=(d.impv||{})[n+"_"+vr]||{},cnt={};
  Object.values(V).forEach(t=>{cnt[t]=(cnt[t]||0)+1});
  const max=Math.max(0,...Object.values(cnt));
  let top=Object.keys(cnt).filter(k=>cnt[k]===max&&max>0),tie=top.length!==1;
  if(tie&&I.tb==="previous"&&top.length>1){
    const iv=id=>((d.players||{})[id]||{}).ivr||0,m2=Math.max(...top.map(iv)),t2=top.filter(x=>iv(x)===m2);
    if(t2.length===1){top=t2;tie=false}
  }
  if(tie&&I.tb==="revote"&&vr<1&&max>0){
    ref.child("imp").transaction(c=>{if(!c||c.n!==n||c.phase!=="vote"||(c.vr||0)!==vr)return;c.vr=vr+1;return c})
      .then(r=>{if(r.committed)ref.child("imp/t0").set(TSV())});
    return;
  }
  const out=tie?"":top[0];
  ref.child("imp").transaction(c=>{

    c.phase="result";c.out=out;c.cnt=cnt;c.votes=V;return c;
  }).then(r=>{if(r.committed)impScore(out,V)});

function ptsOf(I,id){
  const V=I.votes||{},caught=I.out&&I.imps[I.out];

  return V[id]&&I.imps[V[id]]?2:0;
}
function impScore(out,V){

  Object.values(V).forEach(t=>{cnt[t]=(cnt[t]||0)+1});

    u["players/"+id+"/ivr"]=(pl[id].ivr||0)+(cnt[id]||0);
    if((I.ord||[]).includes(id))u["players/"+id+"/tot"]=(pl[id].tot||0)+ptsOf(I,id);

function startRound(prev){
  if(!prev&&(data||{}).host!==myId)return;
  if(((data||{}).cfg||{}).mode==="impostor"){if(!prev)startImp(0);return}
  const c=(data&&data.cfg)||{};
  ref.child("ts").set(firebase.database.ServerValue.TIMESTAMP);
  const pn=prev?prev.n:0;
  let used=prev?(prev.used||prev.letter):"";
  let pool=LETTERS.split("").filter(x=>!used.includes(x));
  if(!pool.length){pool=LETTERS.split("");used=""}
  const l=pool[Math.random()*pool.length|0];
  used+=l;
  ref.child("rd").transaction(cur=>{
    if((cur?cur.n:0)!==pn)return;
    return{n:pn+1,letter:l,used:used,dur:c.dur||0,total:c.total||5,cats:Array.isArray(c.cats)?c.cats:DEFCATS};
  });
}

function changeLetter(){
  const cur=data&&data.rd,used=cur?(typeof cur.ch==="number"?cur.ch:(cur.ch?1:0)):0;if(!cur||used>=2)return;
  if(!confirm("¿Cambiar la letra para todos? Se puede hacer hasta dos veces por ronda y se borran las respuestas."))return;
  ref.child("rd").transaction(c=>{
    const n=c?(typeof c.ch==="number"?c.ch:(c.ch?1:0)):2;
    if(!c||c.n!==cur.n||n>=2)return;
    const used=c.used||c.letter;
    let pool=LETTERS.split("").filter(x=>!used.includes(x));
    if(!pool.length)pool=LETTERS.split("").filter(x=>x!==c.letter);
    const l=pool[Math.random()*pool.length|0];
    return Object.assign({},c,{letter:l,used:used+l,ch:n+1});
  });
}

    if(bad&&!confirm("Tenés "+bad+(bad===1?" palabra que no vale":" palabras que no valen")+". Si decís ¡Basta! perdés "+PEN+" puntos por cada una ("+bad*PEN+" en total). ¿Seguro?"))return;

function buildReveal(m,s){
  const res=score(s),n=s.cur.n,mine=res[myId];
  if(mine){
    if(bankedN!==n){prevTot=banked;prevCw=cw;bankedN=n}
    banked=prevTot+mine.pts;cw=prevCw+mine.c.filter(x=>x.pts===10).length;
    const mp=((data||{}).players||{})[myId]||{};
    if(mp.tot!==banked||mp.tn!==n||mp.cw!==cw)me.update({tot:banked,tn:n,pt:prevTot,cw:cw,pc:prevCw});
  }
  if(s.cur.total&&n>=s.cur.total&&!showAns){buildFinal(m,s);return}
  const rk=el("div","card");rk.appendChild(el("b",null,"Ronda "+n+" · letra "+s.cur.letter));
  s.ps.map(p=>({n:p.me?"Vos":p.name,r:(res[p.id]||{pts:0}).pts,t:p.me?banked:(p.tot||0)})).sort((a,b)=>b.r-a.r).forEach((x,k)=>{
    const r=el("div","row");r.appendChild(el("span",null,(k+1)+". "+x.n));
    r.appendChild(el("span","pts","+"+x.r+" · total "+x.t));rk.appendChild(r);
  });
  m.appendChild(rk);
  const bsd=(data||{}).bs;
  if(bsd&&bsd.n===n&&bsd.by&&res[bsd.by]&&res[bsd.by].pen)
    m.appendChild(el("div","banner","⚠️ ¡Basta falso! "+bsd.name+" perdió "+res[bsd.by].pen+" pts ("+res[bsd.by].bad+(res[bsd.by].bad===1?" palabra":" palabras")+" no valían)"));
  const wrap=el("div","tblw"),tb=el("table","rt");
  const hd=el("tr");hd.appendChild(el("th",null,""));
  s.ps.forEach(p=>{const th=el("th");th.appendChild(avatarEl(p));th.appendChild(document.createTextNode(p.me?"Vos":p.name));hd.appendChild(th)});
  tb.appendChild(hd);
  CATS.forEach((cat,i)=>{
    const tr=el("tr"),th=el("th","cat");
    th.appendChild(el("span",null,ic(cat)));th.appendChild(document.createTextNode(cat));
    tr.appendChild(th);
    s.ps.forEach(p=>{
      const x=res[p.id]&&res[p.id].c[i]||{raw:"",pts:0,votes:0};
      const td=el("td","c "+(x.an?"an":x.pts===10?"g":x.pts===5?"y":x.raw?"r":"e"));
      td.appendChild(el("div","w",x.raw||"—"));
      td.appendChild(el("div","pt","+"+x.pts+(x.votes?" 👎"+x.votes:"")));
      if(x.raw&&!p.me){
        const mv=!!((((data.votes||{})[n]||{})[i+"_"+p.id]||{})[myId]);
        const path="votes/"+n+"/"+i+"_"+p.id+"/"+myId;
        td.classList.add("tap");if(mv)td.classList.add("mv");
        td.onclick=()=>ref.child(path).set(mv?null:true);
      }
      tr.appendChild(td);
    });
    tb.appendChild(tr);
  });
  wrap.appendChild(tb);m.appendChild(wrap);
  m.appendChild(el("p","mut ctr","🟩 10 pts (única) · 🟨 5 pts (repetida) · 🟥 0 pts. Tocá una respuesta de otro jugador para votar 👎 si no vale."));
  const last=s.cur.total&&n>=s.cur.total;
  if(last){
    const b1=el("button","alt","Ver podio");
    b1.onclick=()=>{showAns=false;sig="";update()};
    m.appendChild(b1);
  }
  const b=el("button",null,last?"Volver a la sala":"Siguiente ronda");
  lockResultButton(b,n,last?"Volver a la sala":"Siguiente ronda",()=>last?resetGame():startRound(s.cur));
  m.appendChild(b);
}

const ECOL=["#e11d48","#ffd23f","#16a34a","#38bdf8","#f97316","#c084fc","#fff"];
let eRun=0,ePs=[],eRaf=0;
const eSleep=ms=>new Promise(r=>setTimeout(r,ms));
function eAc(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();AC.resume();return AC}
function eTone(f,t,d,ty,v,f2){if(muted)return;try{const a=eAc(),o=a.createOscillator(),g=a.createGain();o.type=ty||"sine";o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d)}catch(e){}}
function eNoise(t,d,v){if(muted)return;try{const a=eAc(),b=a.createBuffer(1,Math.floor(a.sampleRate*d),a.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1;const x=a.createBufferSource(),g=a.createGain(),f=a.createBiquadFilter();f.type="highpass";f.frequency.value=1500;x.buffer=b;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);x.connect(f);f.connect(g);g.connect(a.destination);x.start(t)}catch(e){}}
function eRoll(dur){if(muted)return;const t0=eAc().currentTime;let t=0,i=0;while(t<dur){eNoise(t0+t,.08,.08+.3*t/dur);if(i%4===0)eTone(110,t0+t,.12,"sine",.3,50);t+=Math.max(.045,.2*(1-t/dur));i++}}
function eBoom(){if(muted)return;const t=eAc().currentTime;eTone(90,t,1.3,"sine",.7,25);eNoise(t,.9,.5)}
function eFan(){if(muted)return;const t=eAc().currentTime;[[523,0],[659,.14],[784,.28]].forEach(([f,d])=>eTone(f,t+d,.2,"sawtooth",.13));[523,659,784,1047].forEach(f=>eTone(f,t+.45,1.1,"sawtooth",.1))}
function eShoot(side,n){for(let i=0;i<n;i++)ePs.push({x:side?innerWidth:0,y:innerHeight,vx:(side?-1:1)*(3+Math.random()*10),vy:-(14+Math.random()*13),r:Math.random()*6,vr:(Math.random()-.5)*.4,w:6+Math.random()*6,h:10+Math.random()*8,c:ECOL[i%ECOL.length]})}
function eLoop(){
  const cv=$("#ecv"),cx=cv.getContext("2d");
  cx.clearRect(0,0,cv.width,cv.height);
  ePs=ePs.filter(p=>p.y<innerHeight+30);
  ePs.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()});
  eRaf=$("#eov").classList.contains("on")?requestAnimationFrame(eLoop):0;
}
function eShake(){const o=$("#eov");o.classList.remove("eshk");void o.offsetWidth;o.classList.add("eshk")}
function eClose(){eRun++;$("#eov").classList.remove("on");$("#est").innerHTML="";try{navigator.vibrate&&navigator.vibrate(0)}catch(e){}}
$("#ex").onclick=eClose;
async function epic(L){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const id=++eRun,ok=()=>id===eRun,ov=$("#eov"),st=$("#est"),cv=$("#ecv");
  const nm=x=>(x&&x.nm)||"";
  ov.classList.add("on");cv.width=innerWidth;cv.height=innerHeight;ePs=[];if(!eRaf)eLoop();
  st.innerHTML='<div class="ebeam"></div><div class="ebeam eb2"></div><div class="etx" id="etx">Y el campeón es…</div>';
  const tx=$("#etx");eRoll(4.2);try{navigator.vibrate&&navigator.vibrate([40,60,40,60,40,60,40,60,40])}catch(e){}
  await eSleep(1400);
  for(const n of [3,2,1]){
    if(!ok())return;
    tx.className="enum";tx.textContent=n;tx.style.animation="none";void tx.offsetWidth;tx.style.animation="";
    if(!muted)eTone(500+(3-n)*160,eAc().currentTime,.25,"square",.15);
    eShake();try{navigator.vibrate&&navigator.vibrate(90)}catch(e){}
    await eSleep(900);
  }
  if(!ok())return;
  eBoom();eFan();try{navigator.vibrate&&navigator.vibrate([250,60,350])}catch(e){}
  st.innerHTML='<div class="eflash"></div><div class="erays"></div><div class="ering"></div><div class="ering" style="animation-delay:.15s"></div><div class="ering" style="animation-delay:.3s"></div><div class="etrophy">🏆</div><div class="ename" id="enm"></div><div class="esub">¡CAMPEÓN!</div>';
  eShake();
  const box=$("#enm"),t=muted?0:eAc().currentTime;
  [...nm(L[0]).toUpperCase()].forEach((c,i)=>{const sp=document.createElement("span");sp.textContent=c;sp.style.animationDelay=(.6+i*.12)+"s";box.appendChild(sp);eTone(200,t+.6+i*.12,.12,"square",.25,60)});
  eShoot(0,80);eShoot(1,80);
  for(let k=0;k<4;k++){await eSleep(900);if(!ok())return;eShoot(0,40);eShoot(1,40)}
  if(L[1]){
    const pod=document.createElement("div");pod.className="epod";
    pod.innerHTML="<div></div>"+(L[2]?"<div></div>":"");
    pod.children[0].textContent="🥈 "+nm(L[1])+" · "+L[1].t;
    if(L[2])pod.children[1].textContent="🥉 "+nm(L[2])+" · "+L[2].t;
    st.appendChild(pod);
  }
  for(let k=0;k<4;k++){await eSleep(1000);if(!ok())return;eShoot(k%2,35)}
  eClose();
}

document.addEventListener("pointerdown",()=>{if(AC&&AC.state==="suspended")AC.resume();remoteAudios.forEach(a=>a.play().catch(()=>{}))});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&db)db.goOnline()});
let iRun=0;
function iClose(){iRun++;$("#iov").classList.remove("on");$("#ist").innerHTML=""}
function iSound(){
  if(muted)return;
  try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();AC.resume();
    const t=AC.currentTime;[523,659,784,1047].forEach((f,i)=>eTone(f,t+i*.07,.18,"triangle",.18))}catch(e){}
}
async function intro(){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  try{if(sessionStorage.getItem("tf-intro"))return;sessionStorage.setItem("tf-intro","1")}catch(e){}
  const ov=$("#iov"),st=$("#ist"),id=++iRun,ok=()=>id===iRun;
  ov.classList.add("on");
  ov.onclick=()=>{iSound();iClose()};
  st.innerHTML='<div class="itile" id="itile">A</div>';
  const tile=$("#itile");
  let d=45;
  for(let k=0;k<16;k++){
    if(!ok())return;
    tile.textContent=LETTERS[Math.random()*LETTERS.length|0];
    ov.style.setProperty("--ih",(k*47)%360);
    await eSleep(d);d*=1.12;
  }
  tile.textContent="T";ov.style.setProperty("--ih",330);
  await eSleep(500);if(!ok())return;
  tile.classList.add("out");
  const fr=["🍉","🍓","🍍","🍋","🍇","🍒","🍊","🥝"];
  for(let i=0;i<22;i++){
    const e=document.createElement("i");e.className="ifr";e.textContent=fr[i%fr.length];
    e.style.left=(Math.random()*90)+"%";e.style.animationDelay=(Math.random()*.9)+"s";
    e.style.fontSize=(30+Math.random()*28)+"px";st.appendChild(e);
  }
  await eSleep(350);if(!ok())return;
  tile.remove();
  const ttl=document.createElement("div");ttl.className="ititle";
  ["TUTTI","FRUTTI"].forEach((w,wi)=>{
    const line=document.createElement("div");
    [...w].forEach((c,i)=>{
      const sp=document.createElement("span");sp.textContent=c;
      sp.style.animationDelay=(wi*.4+i*.08)+"s";
      sp.style.setProperty("--r",(Math.random()*60-30)+"deg");
      sp.style.color=["#fff","#ffe14d","#fff","#c8f7c5","#fff","#ffd0e0"][i%6];
      line.appendChild(sp);
    });
    ttl.appendChild(line);
  });
  st.appendChild(ttl);
  const sub=document.createElement("div");sub.className="isub";sub.textContent="El juego de palabras con amigos";st.appendChild(sub);
  await eSleep(2000);if(!ok())return;
  const go=document.createElement("button");go.className="igo";go.textContent="¡Tocá para jugar!";
  go.onclick=e=>{e.stopPropagation();iSound();iClose()};
  st.appendChild(go);
}

["nm","cd"].forEach(id=>$("#"+id).addEventListener("keydown",e=>{if(e.key==="Enter")$("#enter").click()}));
try{
  const q=(new URLSearchParams(location.search).get("sala")||"").replace(/\D/g,"").slice(0,6);
  const sv=JSON.parse(localStorage.getItem("tf-room")||"null");
  if(q){
    $("#cd").value=q;
    if($("#nm").value.trim()){$("#err").textContent="Entrando a la sala…";go(q)}
    else{$("#err").textContent="Te invitaron a la sala "+q+". Poné tu nombre y tocá Entrar.";$("#nm").focus()}
  }else if(sv&&/^\d+$/.test(sv.code)&&Date.now()-sv.t<72e5&&$("#nm").value.trim()){
    $("#cd").value=sv.code;$("#err").textContent="Reconectando a la sala…";go(sv.code);
  }else intro();
}catch(e){}
