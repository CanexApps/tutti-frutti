<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tutti Frutti</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2a1b4a;--paper:#fffdf7;--ok:#16803c;--h:48;--bg:hsl(var(--h) 88% 66%)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:500 17px/1.4 "Fredoka","Trebuchet MS",system-ui,sans-serif;transition:background .5s;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
main{max-width:480px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:36px;line-height:1;margin:6px 0 6px;font-weight:700;letter-spacing:-.5px}
.mut{font-size:15px;opacity:.8}
.ctr{text-align:center}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:14px;margin:14px 0;box-shadow:5px 5px 0 var(--ink)}
input,select{width:100%;font:inherit;padding:11px 12px;border-radius:12px;border:2.5px solid var(--ink);background:#fff;color:var(--ink);margin:4px 0 10px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button{font:inherit;font-weight:700;padding:13px 16px;border-radius:14px;border:3px solid var(--ink);background:var(--ink);color:#fff;width:100%;margin:8px 0 4px;box-shadow:0 5px 0 rgba(42,27,74,.35);cursor:pointer;transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(42,27,74,.35)}
button.alt{background:var(--paper);color:var(--ink)}
button.basta{background:#e11d48;font-size:26px;padding:16px;margin-top:14px}
button:disabled{opacity:.5}
.letter{width:150px;height:150px;margin:10px auto 8px;display:grid;place-items:center;background:var(--paper);color:hsl(var(--h) 85% 40%);border:4px solid var(--ink);border-radius:28px;box-shadow:6px 6px 0 var(--ink);font-size:104px;font-weight:700;line-height:1;transform:rotate(-4deg);animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:rotate(-14deg) scale(.4);opacity:0}}
@media(prefers-reduced-motion:reduce){.letter{animation:none}body{transition:none}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--paper);border:2.5px solid var(--ink);border-radius:99px;padding:3px 11px;font-size:15px;font-weight:600}
.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1.5px dashed rgba(42,27,74,.25)}
.row:last-child{border-bottom:0}
.pts{font-weight:700;color:var(--ok)}.pts.z{color:#8b7fa3}
.banner{background:#ffe14d;border:3px solid var(--ink);border-radius:16px;padding:10px;text-align:center;font-weight:700;margin:12px 0;box-shadow:4px 4px 0 var(--ink)}
label{display:block;font-size:15px;font-weight:600}
.pill{display:table;margin:4px auto 10px;background:var(--paper);border:2.5px solid var(--ink);border-radius:99px;padding:2px 14px;font-weight:700}
.room{display:inline-block;background:var(--paper);border:2.5px solid var(--ink);border-radius:99px;padding:2px 14px;margin:0 0 10px}
.room b{letter-spacing:1px}
.hide{display:none}
</style></head>
<body><main>
<h1>🍉 Tutti Frutti</h1>
<div id="join">
  <p class="mut">El juego de palabras para jugar con amigos, cada uno desde su teléfono.</p>
  <div class="card">
    <label>Tu nombre</label><input id="nm" maxlength="16" autocomplete="off">
    <label>Código de sala</label><input id="cd" maxlength="12" autocomplete="off" autocapitalize="none" placeholder="ej: abcd">
    <button id="enter">Entrar a la sala</button>
    <button id="create" class="alt">Crear sala nueva</button>
    <div id="err" class="mut"></div>
  </div>
  <p class="mut">Uno crea la sala y les pasa el código a los demás.</p>
</div>
<div id="game" class="hide">
  <div style="display:flex;justify-content:space-between;align-items:center"><div class="room">Sala <b id="code"></b></div><div style="display:flex;gap:8px"><button id="snd" class="alt" style="width:auto;padding:4px 12px;margin:0 0 10px" aria-label="Sonido">🔊</button><button id="exit" class="alt" style="width:auto;padding:4px 12px;margin:0 0 10px">Salir</button></div></div>
  <div id="players" class="chips" style="margin:8px 0"></div>
  <div id="msg"></div>
  <div id="main"></div>
</div>
<div class="mut ctr" style="margin-top:22px">Versión <span id="ver"></span></div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig={
  apiKey:"AIzaSyDNcYs0Liq5owyN71l-J5yxYNEupNaN_vU",
  authDomain:"juego-73eec.firebaseapp.com",
  databaseURL:"https://juego-73eec-default-rtdb.firebaseio.com",
  projectId:"juego-73eec",
  storageBucket:"juego-73eec.firebasestorage.app",
  messagingSenderId:"1036415896248",
  appId:"1:1036415896248:web:a602680fafa74725b1024d"
};
const VERSION="2.2";
const GRACE=45000;
const DEFCATS=["Nombre","Apellido","Ciudad","País","Animal","Color","Cosa"];
let CATS=DEFCATS.slice();
const ICON={Nombre:"🧑",Apellido:"👥",Ciudad:"🏙️",País:"🌎",Animal:"🐾",Color:"🎨",Cosa:"📦",Marca:"🏷️",Comida:"🍕",Profesión:"💼",Fruta:"🍓",Película:"🎬",Deporte:"⚽",Canción:"🎵"};
const SUGG=["Marca","Comida","Profesión","Fruta","Película","Deporte","Canción"];
const ic=c=>ICON[c]||"🔹";
const LETTERS="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const $=s=>document.querySelector(s);
const norm=s=>String(s||"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
let db,ref,me,myId,myName="",myAns=[],data=null;
let srvOff=0,graceAt=0,graceActive=false,left=false,lastEv="",roomCode="",prevTot=0,prevCw=0,cw=0,lastL="",jtSet=false,claiming=false,roundSeen={},lastN=0,sig="",bastaSeen={},banked=0,bankedN=0,flushedN=0,timer,deb;
try{$("#nm").value=localStorage.getItem("tf-name")||"";myId=localStorage.getItem("tf-id")}catch(e){}
if(!myId){myId=Math.random().toString(36).slice(2,12);try{localStorage.setItem("tf-id",myId)}catch(e){}}

let AC=null,muted=false;
try{muted=localStorage.getItem("tf-mute")==="1"}catch(e){}
$("#ver").textContent=VERSION;
$("#snd").textContent=muted?"🔇":"🔊";
$("#snd").onclick=()=>{muted=!muted;$("#snd").textContent=muted?"🔇":"🔊";try{localStorage.setItem("tf-mute",muted?"1":"0")}catch(e){}};
$("#exit").onclick=()=>{
  if(!confirm("¿Salir de la sala y volver al inicio?"))return;
  left=true;try{localStorage.removeItem("tf-room")}catch(e){}
  const done=()=>location.reload();
  try{me.onDisconnect().cancel();me.update({on:false,off:null}).then(done,done)}catch(e){done()}
  setTimeout(done,2000);
};
function snd(k){
  if(!muted&&AC){try{
    AC.resume();
    const seq={start:[[523,.1],[659,.1],[784,.18]],basta:[[300,.12],[300,.2]],done:[[784,.1],[988,.1],[1319,.25]]}[k];
    let t=AC.currentTime;
    seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type="triangle";o.frequency.value=f;
      g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);t+=d});
  }catch(e){}}
  try{if(navigator.vibrate){if(k==="basta")navigator.vibrate([200]);else if(k==="start")navigator.vibrate([60,40,60])}}catch(e){}
}
function cleanup(){
  db.ref("rooms").orderByChild("ts").endAt(Date.now()-864e5).limitToFirst(25).once("value")
    .then(x=>{x.forEach(c=>{if(c.key!==roomCode)c.ref.remove()})}).catch(()=>{});
}

function go(code){
  myName=$("#nm").value.trim().slice(0,16);
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)()}catch(e){}
  code=code.toLowerCase().replace(/[^a-z0-9]/g,"");
  if(!myName){$("#err").textContent="Poné tu nombre.";return}
  if(!code){$("#err").textContent="Poné un código de sala.";return}
  try{localStorage.setItem("tf-name",myName)}catch(e){}
  if(typeof firebase==="undefined"){$("#err").textContent="No cargó Firebase. Revisá tu conexión.";return}
  if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
  db=firebase.database();
  db.ref(".info/serverTimeOffset").on("value",x=>{srvOff=x.val()||0});
  ref=db.ref("rooms/"+code);
  me=ref.child("players/"+myId);
  $("#err").textContent="Conectando…";
  roomCode=code;
  ref.child("kicked/"+myId).once("value").then(k=>{
    if(k.val())throw{code:"kicked"};
    return ref.child("players/"+myId).once("value");
  }).then(snap=>{
    const old=snap.val()||{};
    banked=old.tot||0;bankedN=old.tn||0;prevTot=old.pt||0;cw=old.cw||0;prevCw=old.pc||0;
    ref.child("ts").set(firebase.database.ServerValue.TIMESTAMP);cleanup();
    try{localStorage.setItem("tf-room",JSON.stringify({code:roomCode,t:Date.now()}))}catch(e){}
    db.ref(".info/connected").on("value",s=>{
      if(s.val()===true&&!left){me.onDisconnect().update({on:false,off:firebase.database.ServerValue.TIMESTAMP});const u={name:myName,on:true,off:null};if(!old.jt&&!jtSet){u.jt=firebase.database.ServerValue.TIMESTAMP;jtSet=true}me.update(u)}
    });
    $("#join").classList.add("hide");$("#game").classList.remove("hide");
    $("#code").textContent=code;
    ref.on("value",s=>{data=s.val();update()});setInterval(tick,500);
  }).catch(e=>{if(e&&e.code==="kicked"){try{localStorage.removeItem("tf-room")}catch(x){}}
    $("#err").textContent=e&&e.code==="kicked"?"No podés entrar a esa sala.":"Error de conexión: "+(e&&e.code||e)});
}
$("#enter").onclick=()=>go($("#cd").value);
$("#create").onclick=()=>{const c=Math.random().toString(36).slice(2,6);$("#cd").value=c;go(c)};

function state(){
  const d=data||{},pl=d.players||{};
  const ps=Object.keys(pl).filter(k=>pl[k].name&&(pl[k].on||(pl[k].off&&Date.now()+srvOff-pl[k].off<GRACE)))
    .map(k=>Object.assign({id:k,me:k===myId,rc:!pl[k].on},pl[k]));
  graceActive=ps.some(p=>p.rc);
  const cur=d.rd||null;
  const b=cur&&d.bs&&d.bs.n===cur.n?d.bs:null;
  let phase="lobby";
  if(cur){phase="play";
    if(b){if(!bastaSeen[cur.n])bastaSeen[cur.n]=Date.now();
      phase=Date.now()-bastaSeen[cur.n]<2500?"closing":"reveal"}}
  return{ps,cur,b,phase};
}

function score(s){
  const L=norm(s.cur.letter),res={},V=((data||{}).votes||{})[s.cur.n]||{};
  const ans=p=>p.a&&p.a.n===s.cur.n&&p.a.v?p.a.v:[];
  const nv=(i,p)=>Object.keys(V[i+"_"+p.id]||{}).filter(k=>k!==p.id).length;
  const an=(i,p)=>nv(i,p)*2>Math.max(s.ps.length-1,1);
  const okf=(p,i)=>{const t=norm(ans(p)[i]);return t.length>1&&t[0]===L&&!an(i,p)};
  CATS.forEach((c,i)=>{
    const cnt=Object.create(null);
    s.ps.forEach(p=>{if(okf(p,i)){const t=norm(ans(p)[i]);cnt[t]=(cnt[t]||0)+1}});
    s.ps.forEach(p=>{
      const raw=String(ans(p)[i]||"").trim(),t=norm(raw),ok=okf(p,i);
      (res[p.id]=res[p.id]||{pts:0,c:[]}).c[i]={raw,pts:ok?(cnt[t]>1?5:10):0,votes:nv(i,p),an:an(i,p)&&t.length>1};
    });
  });
  for(const k in res)res[k].pts=res[k].c.reduce((a,x)=>a+x.pts,0);
  return res;
}

const clean=()=>CATS.map((_,i)=>String(myAns[i]||""));
const sendAns=n=>me.child("a").set({n,v:clean()});

function tick(){
  if(graceActive&&Date.now()-graceAt>5000){graceAt=Date.now();update()}
  const c=data&&data.rd;
  if(!c||!c.dur||(data.bs&&data.bs.n===c.n))return;
  const left=c.dur-Math.floor((Date.now()-(roundSeen[c.n]||Date.now()))/1000);
  const t=$("#tm");if(t)t.textContent="⏱ "+Math.max(left,0)+" s";
  if(left<=0)ref.child("bs").transaction(x=>(x&&x.n===c.n)?undefined:{n:c.n,t:1});
}

function update(){
  const s=state(),d=data||{};
  if(d.kicked&&d.kicked[myId]&&!left){left=true;ref.off();try{me.onDisconnect().cancel();me.remove()}catch(e){}try{localStorage.removeItem("tf-room")}catch(e){}alert("El anfitrión te sacó de la sala.");location.reload();return}
  if(s.cur&&Array.isArray(s.cur.cats))CATS=s.cur.cats;
  else if(!s.cur)CATS=Array.isArray((d.cfg||{}).cats)?d.cfg.cats:DEFCATS;
  const ev=s.phase+":"+(s.cur?s.cur.n+s.cur.letter:"");
  if(ev!==lastEv){lastEv=ev;try{localStorage.setItem("tf-room",JSON.stringify({code:roomCode,t:Date.now()}))}catch(e){}if(s.phase==="play")snd("start");else if(s.phase==="closing")snd("basta");else if(s.phase==="reveal")snd("done")}
  document.documentElement.style.setProperty("--h",s.cur?Math.round(LETTERS.indexOf(s.cur.letter)*13.8):48);
  const pl=$("#players");pl.textContent="";
  pl.classList.toggle("hide",s.phase==="lobby");
  s.ps.forEach(p=>{
    let ex="";
    if((s.phase==="play"||s.phase==="closing")&&s.cur){
      const k=p.a&&p.a.n===s.cur.n&&p.a.v?Object.values(p.a.v).filter(x=>norm(x).length>0).length:0;
      ex=k>=CATS.length?" ✅":" ✍️"+k+"/"+CATS.length;
    }
    pl.appendChild(el("span","chip",(p.rc?"⏳ ":"")+(d.host===p.id?"👑 ":"")+(p.me?"Vos":p.name)+": "+(p.tot||0)+" pts"+ex));
  });
  // anfitrión: si no hay o está desconectado, lo toma el que entró primero
  const hostOn=d.host&&s.ps.some(p=>p.id===d.host);
  if(!hostOn&&s.ps.length&&!claiming){
    const first=s.ps.slice().sort((a,b)=>(a.jt||0)-(b.jt||0))[0];
    if(first.me){claiming=true;const seen=d.host||null;
      ref.child("host").transaction(c=>(c||null)===seen?myId:undefined).then(()=>{claiming=false},()=>{claiming=false})}
  }
  if(!s.cur){lastN=0;lastL="";flushedN=0;bastaSeen={};roundSeen={};
    const mp=(d.players||{})[myId]||{};banked=mp.tot||0;bankedN=mp.tn||0;prevTot=mp.pt||0;cw=mp.cw||0;prevCw=mp.pc||0}
  if(s.cur&&!roundSeen[s.cur.n])roundSeen[s.cur.n]=Date.now();
  if(s.cur&&(s.cur.n!==lastN||s.cur.letter!==lastL)){lastN=s.cur.n;lastL=s.cur.letter;myAns=[];sendAns(lastN)}
  clearTimeout(timer);
  const msg=$("#msg");msg.textContent="";
  if(s.phase==="closing"){
    msg.appendChild(el("div","banner",s.b.t?"¡Se acabó el tiempo!":"¡BASTA! "+s.b.name+" terminó. Cerrando…"));
    if(flushedN!==s.cur.n){flushedN=s.cur.n;sendAns(s.cur.n)}
    document.querySelectorAll("#main input,#main button").forEach(e=>e.disabled=true);
    timer=setTimeout(update,2600-(Date.now()-bastaSeen[s.cur.n])+60);
  }
  const key=s.phase==="lobby"?"l":s.phase==="reveal"?"r"+Date.now():"p"+(s.cur&&(s.cur.n+s.cur.letter));
  if(key!==sig){
    const y=window.scrollY;sig=key;
    const m=$("#main");m.textContent="";
    if(s.phase==="lobby")buildLobby(m);
    else if(s.phase==="reveal")buildReveal(m,s);
    else buildPlay(m,s);
    if(s.phase==="reveal")window.scrollTo(0,y);
  }
  if(s.phase==="lobby")refreshLobby(s);
}

function startRound(prev){
  if(!prev&&(data||{}).host!==myId)return;
  const c=(data&&data.cfg)||{};
  ref.child("ts").set(firebase.database.ServerValue.TIMESTAMP);
  const pn=prev?prev.n:0;
  let used=prev?(prev.used||prev.letter):"";
  let pool=LETTERS.split("").filter(x=>!used.includes(x));
  if(!pool.length){pool=LETTERS.split("");used=""}
  const l=pool[Math.random()*pool.length|0];
  used+=l;
  ref.child("rd").transaction(cur=>{
    if((cur?cur.n:0)!==pn)return;
    return{n:pn+1,letter:l,used:used,dur:c.dur||0,total:c.total||5,cats:Array.isArray(c.cats)?c.cats:DEFCATS};
  });
}

function changeLetter(){
  const cur=data&&data.rd;if(!cur||cur.ch)return;
  if(!confirm("¿Cambiar la letra para todos? Solo se puede una vez por ronda y se borran las respuestas."))return;
  ref.child("rd").transaction(c=>{
    if(!c||c.n!==cur.n||c.ch)return;
    const used=c.used||c.letter;
    let pool=LETTERS.split("").filter(x=>!used.includes(x));
    if(!pool.length)pool=LETTERS.split("").filter(x=>x!==c.letter);
    const l=pool[Math.random()*pool.length|0];
    return Object.assign({},c,{letter:l,used:used+l,ch:1});
  });
}

function resetGame(){
  const u={rd:null,bs:null};
  Object.keys((data||{}).players||{}).forEach(k=>{u["players/"+k+"/tot"]=0;u["players/"+k+"/tn"]=0;["a","pt","pc","cw","bc"].forEach(f=>u["players/"+k+"/"+f]=null)});
  ref.update(u);
}

function setCfg(){ref.child("cfg").update({total:+$("#st").value,dur:+$("#sd").value})}

function setCats(a){ref.child("cfg/cats").set(a)}
function kick(id,name){
  if(!confirm("¿Sacar a "+name+" de la sala?"))return;
  ref.child("kicked/"+id).set(true);ref.child("players/"+id).remove();
}

function buildLobby(m){
  m.innerHTML='<div class="card"><b>Jugadores (<span id="mcount">1</span>)</b><div id="mem"></div>'+
   '<button id="shr" class="alt">Compartir código</button></div>'+
   '<div id="hostbox" class="card hide"><b>Sos el anfitrión 👑</b><br><label>Rondas</label>'+
   '<select id="st"><option>3</option><option>5</option><option>8</option><option>10</option></select>'+
   '<label>Tiempo por ronda</label><select id="sd"><option value="0">Sin límite</option><option value="60">60 s</option><option value="90">90 s</option><option value="120">120 s</option></select>'+
   '<label>Categorías (tocá una para quitarla)</label><div id="cats" class="chips" style="margin-bottom:8px"></div>'+
   '<label>Sugeridas (tocá para sumar)</label><div id="sug" class="chips" style="margin-bottom:8px"></div>'+
   '<div style="display:flex;gap:8px;align-items:center"><input id="nc" maxlength="16" placeholder="Otra categoría" style="margin:0"><button id="addc" style="width:auto;margin:0;padding:10px 14px">Sumar</button></div>'+
   '<button id="go">Empezar partida</button></div>'+
   '<div id="guestbox" class="card hide"><p>Esperando a que <b id="hn"></b> inicie la partida…</p><div class="mut" id="cfgtxt"></div><div class="mut" id="gcats"></div></div>';
  $("#st").onchange=setCfg;$("#sd").onchange=setCfg;
  $("#go").onclick=()=>startRound(null);
  $("#addc").onclick=()=>{
    const v=$("#nc").value.trim().slice(0,16),cur=CATS.slice();
    if(!v||cur.length>=10||cur.some(x=>norm(x)===norm(v)))return;
    cur.push(v);$("#nc").value="";setCats(cur);
  };
  $("#shr").onclick=()=>{
    const t="Jugá Tutti Frutti conmigo. Código de sala: "+$("#code").textContent;
    if(navigator.share)navigator.share({text:t,url:location.href}).catch(()=>{});
    else if(navigator.clipboard)navigator.clipboard.writeText(t+" "+location.href).then(()=>{$("#shr").textContent="¡Copiado!"});
  };
}

function refreshLobby(s){
  const d=data||{},cfg=d.cfg||{},host=d.host===myId;
  const mem=$("#mem");if(!mem)return;
  mem.textContent="";
  s.ps.slice().sort((a,b)=>(a.jt||0)-(b.jt||0)).forEach(p=>{
    const r=el("div","row");
    r.appendChild(el("span",null,(d.host===p.id?"👑 ":"")+p.name+(p.me?" (vos)":"")+(p.rc?" ⏳ reconectando":"")));
    if(host&&!p.me){
      const k=el("button","alt","Sacar");
      k.style.cssText="width:auto;margin:0;padding:1px 10px;font-size:14px;box-shadow:none";
      k.onclick=()=>kick(p.id,p.name);r.appendChild(k);
    }
    mem.appendChild(r);
  });
  $("#mcount").textContent=s.ps.length;
  $("#hostbox").classList.toggle("hide",!host);
  $("#guestbox").classList.toggle("hide",host);
  const hn=s.ps.find(p=>p.id===d.host);
  $("#hn").textContent=hn?hn.name:"el anfitrión";
  $("#cfgtxt").textContent="Rondas: "+(cfg.total||5)+" · Tiempo: "+(cfg.dur?cfg.dur+" s":"sin límite");
  $("#gcats").textContent="Categorías: "+CATS.join(", ");
  if(document.activeElement!==$("#st"))$("#st").value=String(cfg.total||5);
  if(document.activeElement!==$("#sd"))$("#sd").value=String(cfg.dur||0);
  const cb=$("#cats"),sb=$("#sug");cb.textContent="";sb.textContent="";
  CATS.forEach(c=>{
    const e=el("span","chip",ic(c)+" "+c+(CATS.length>3?" ✕":""));e.style.cursor="pointer";
    e.onclick=()=>{if(CATS.length>3)setCats(CATS.filter(x=>x!==c))};cb.appendChild(e);
  });
  SUGG.filter(c=>!CATS.includes(c)).forEach(c=>{
    const e=el("span","chip","+ "+ic(c)+" "+c);e.style.cursor="pointer";
    e.onclick=()=>{if(CATS.length<10)setCats(CATS.concat(c))};sb.appendChild(e);
  });
}

function buildPlay(m,s){
  const n=s.cur.n;
  m.appendChild(el("div","mut ctr","Ronda "+n+" de "+(s.cur.total||"?")+": palabras con la letra"));
  m.appendChild(el("div","letter",s.cur.letter));
  if(s.cur.dur){const t=el("div","pill","");t.id="tm";m.appendChild(t)}
  if(!s.cur.ch){const cb=el("button","alt","Cambiar letra");cb.style.cssText="width:auto;margin:0 auto 6px;display:block;padding:6px 16px;font-size:15px";cb.onclick=changeLetter;m.appendChild(cb)}
  const c=el("div","card");
  CATS.forEach((cat,i)=>{
    c.appendChild(el("label",null,ic(cat)+" "+cat));
    const inp=el("input");inp.maxLength=30;inp.autocomplete="off";
    inp.value=myAns[i]||"";
    inp.oninput=()=>{myAns[i]=inp.value;clearTimeout(deb);deb=setTimeout(()=>sendAns(n),300)};
    c.appendChild(inp);
  });
  const b=el("button","basta","¡BASTA!"),err=el("div","mut ctr");
  b.onclick=()=>{
    if(!CATS.every((_,i)=>norm(myAns[i]).length>0)){err.textContent="Completá todas las categorías para decir basta.";return}
    sendAns(n);
    ref.child("bs").transaction(cur=>(cur&&cur.n===n)?undefined:{n,name:myName}).then(r=>{if(r.committed)me.child("bc").transaction(x=>(x||0)+1)});
  };
  c.appendChild(b);c.appendChild(err);m.appendChild(c);
}

function buildReveal(m,s){
  const res=score(s),n=s.cur.n,mine=res[myId];
  if(mine){
    if(bankedN!==n){prevTot=banked;prevCw=cw;bankedN=n}
    banked=prevTot+mine.pts;cw=prevCw+mine.c.filter(x=>x.pts===10).length;
    const mp=((data||{}).players||{})[myId]||{};
    if(mp.tot!==banked||mp.tn!==n||mp.cw!==cw)me.update({tot:banked,tn:n,pt:prevTot,cw:cw,pc:prevCw});
  }
  m.appendChild(el("div","mut","Ronda "+n+" · letra "+s.cur.letter+" · tocá 👎 si una palabra no vale"));
  CATS.forEach((cat,i)=>{
    const c=el("div","card");c.appendChild(el("b",null,ic(cat)+" "+cat));
    s.ps.forEach(p=>{
      const x=res[p.id]&&res[p.id].c[i]||{raw:"",pts:0,votes:0};
      const r=el("div","row");
      const l=el("span",null,(p.me?"Vos":p.name)+": "+(x.raw||"—"));
      if(x.an)l.style.textDecoration="line-through";
      r.appendChild(l);
      const rt=el("span");rt.style.cssText="display:flex;gap:8px;align-items:center";
      if(x.raw&&!p.me){
        const mv=!!((((data.votes||{})[n]||{})[i+"_"+p.id]||{})[myId]);
        const path="votes/"+n+"/"+i+"_"+p.id+"/"+myId;
        const vb=el("button","alt","👎"+(x.votes||""));
        vb.style.cssText="width:auto;margin:0;padding:1px 9px;font-size:14px;box-shadow:none"+(mv?";background:#ffe14d":"");
        vb.onclick=()=>ref.child(path).set(mv?null:true);
        rt.appendChild(vb);
      }else if(x.votes)rt.appendChild(el("span","mut","👎"+x.votes));
      rt.appendChild(el("span","pts"+(x.pts?"":" z"),"+"+x.pts));
      r.appendChild(rt);c.appendChild(r);
    });
    m.appendChild(c);
  });
  const list=s.ps.map(p=>({n:p.me?"Vos":p.name,t:p.me?banked:(p.tot||0),u:p.me?cw:(p.cw||0),b:p.bc||0}));
  const t=el("div","card");t.appendChild(el("b",null,"Puntaje total"));
  list.slice().sort((a,b)=>b.t-a.t).forEach(x=>{
    const r=el("div","row");r.appendChild(el("span",null,x.n));
    r.appendChild(el("span","pts",x.t+" pts"));t.appendChild(r)});
  m.appendChild(t);
  const last=s.cur.total&&n>=s.cur.total;
  if(last){
    const top=k=>list.slice().sort((a,b)=>b[k]-a[k])[0];
    const w=top("t"),u=top("u"),f=top("b");
    m.appendChild(el("div","banner","🏆 Ganó "+w.n+" con "+w.t+" pts"));
    const c=el("div","card");c.appendChild(el("b",null,"Resumen de la partida"));
    const add=x=>{const r=el("div","row");r.appendChild(el("span",null,x));c.appendChild(r)};
    add("🏆 Campeón/a: "+w.n);
    if(u.u>0)add("💡 Más palabras únicas: "+u.n+" ("+u.u+")");
    if(f.b>0)add("⚡ Más rápido: "+f.n+" ("+f.b+(f.b===1?" basta)":" bastas)"));
    m.appendChild(c);
  }
  const b=el("button",null,last?"Volver a la sala":"Siguiente ronda");
  b.onclick=()=>last?resetGame():startRound(s.cur);
  m.appendChild(b);
}
document.addEventListener("pointerdown",()=>{if(AC&&AC.state==="suspended")AC.resume()});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&db)db.goOnline()});
try{
  const sv=JSON.parse(localStorage.getItem("tf-room")||"null");
  if(sv&&Date.now()-sv.t<72e5&&$("#nm").value.trim()){
    $("#cd").value=sv.code;$("#err").textContent="Reconectando a la sala…";go(sv.code);
  }
}catch(e){}
</script></body></html>
